name: Build Android APK
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: |
          SDKROOT=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          echo "SDKROOT=$SDKROOT"
          yes | $SDKROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null 2>&1 || true
          echo "ndk.dir=$SDKROOT/ndk/26.1.10909125" > android/local.properties
          echo "sdk.dir=$SDKROOT" >> android/local.properties
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify babel aliases
        run: |
          cat babel.config.js
          grep -q module-resolver babel.config.js && echo BABEL_ALIAS_OK
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/app/nobody.jks"
            printf 'storeFile=%s/android/app/nobody.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$GITHUB_WORKSPACE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$GITHUB_WORKSPACE/android/keystore.properties"
            echo SIGNING_CONFIGURED
          else
            echo NO_KEYSTORE_SECRET
            exit 1
          fi
      - name: Build release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NobodyMusic-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: music-app-latest
          name: Nobody Music 最新版
          body: |
            Nobody Music 自动构建（music-app-latest）
            版本 10.2.0 (versionCode 23)
            修复：启动不再探测音源、内置源后台导入、首装音源空值
          files: android/app/build/outputs/apk/release/*.apk
          make_latest: true
